name: Record Twitch Stream (On-Demand)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Twitch Channel Name'
        required: true
        default: 'vishislive'
        type: string
      duration_hours:
        description: 'Max Recording Duration (Hours)'
        required: true
        default: '5'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
      quality:
        description: 'Video Quality'
        required: true
        default: 'best'
        type: choice
        options:
          - 'best'
          - '1080p60'
          - '720p60'
          - '720p'
          - '480p'
      auto_finish:
        description: 'Upload immediately after stream ends (10-min crash grace period)'
        required: true
        default: true
        type: boolean

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      IN_CHANNEL: ${{ inputs.channel }}
      IN_QUALITY: ${{ inputs.quality }}
      IN_HOURS: ${{ inputs.duration_hours }}
      IN_AUTO_FINISH: ${{ inputs.auto_finish }}
    steps:
      - name: Fast Install Streamlink
        run: |
          pip install -q --upgrade streamlink

      - name: Monitor and Record Stream
        continue-on-error: true
        run: |
          set +e

          # Background task ("2nd terminal"): free disk space + install tools while recording runs
          (
            sudo ionice -c 3 rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
            if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v jq >/dev/null 2>&1 || ! command -v curl >/dev/null 2>&1 || ! command -v rclone >/dev/null 2>&1; then
              sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg jq curl rclone
            fi
          ) >/dev/null 2>&1 &

          CHANNEL="${IN_CHANNEL:-vishislive}"
          QUALITY="${IN_QUALITY:-best}"
          HOURS="${IN_HOURS:-5}"
          AUTO_FINISH="${IN_AUTO_FINISH:-true}"

          DURATION_SEC=$((HOURS * 3600))
          END_TIME=$(( $(date +%s) + DURATION_SEC ))
          PART=1
          HAS_RECORDED=false

          echo "Starting recorder for twitch.tv/$CHANNEL"
          echo "Max Duration: ${HOURS}h (${DURATION_SEC}s) | Quality: $QUALITY | Auto-Finish: $AUTO_FINISH"

          while [ "$(date +%s)" -lt "$END_TIME" ]; do
            REMAINING=$(( END_TIME - $(date +%s) ))

            if [ "$REMAINING" -le 60 ]; then
              echo "Time window expiring (${REMAINING}s remaining). Exiting loop."
              break
            fi

            TS_FILE="part_${PART}.ts"
            MP4_FILE="part_${PART}.mp4"

            if [ "$HAS_RECORDED" = "true" ] && [ "$AUTO_FINISH" = "true" ]; then
              echo "Stream dropped. Waiting up to 10 minutes for reconnect..."
              # 15s x 40 retries = 600s (10 minutes)
              timeout "${REMAINING}s" streamlink --retry-streams 15 --retry-max 40 --twitch-supported-codecs h264 "https://www.twitch.tv/$CHANNEL" "$QUALITY" -o "$TS_FILE" || true
            else
              echo "Waiting for $CHANNEL to go live (${REMAINING}s remaining in window)..."
              timeout "${REMAINING}s" streamlink --retry-streams 30 --twitch-supported-codecs h264 "https://www.twitch.tv/$CHANNEL" "$QUALITY" -o "$TS_FILE" || true
            fi

            if [ -s "$TS_FILE" ]; then
              HAS_RECORDED=true

              # If the stream was very short, make sure the background install has finished
              if ! command -v ffmpeg >/dev/null 2>&1; then
                wait
              fi

              echo "Normalizing Part $PART for merging..."
              if ffmpeg -y -i "$TS_FILE" -c copy "$MP4_FILE"; then
                rm -f "$TS_FILE"
                echo "file '$MP4_FILE'" >> mylist.txt
              else
                echo "Could not convert $TS_FILE now; it will be rescued in the upload step."
              fi
              PART=$((PART + 1))
            else
              if [ "$HAS_RECORDED" = "true" ] && [ "$AUTO_FINISH" = "true" ]; then
                echo "Streamer did not reconnect within 10 minutes. Finishing and uploading now!"
                break
              fi
            fi

            sleep 10
          done

          # Don't leave the background installer running when this step ends
          wait

      - name: Merge Parts and Upload to Cloud
        if: always()
        env:
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG }}
        run: |
          set +e

          CHANNEL="${IN_CHANNEL:-vishislive}"

          # Ensure post-processing tools are ready
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v rclone >/dev/null 2>&1 || ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg jq curl rclone
          fi

          # Rescue any leftover .ts segment (manual cancel, or conversion failed earlier)
          for TS_FILE in part_*.ts; do
            if [ -s "$TS_FILE" ]; then
              MP4_FILE="${TS_FILE%.ts}.mp4"
              echo "Rescuing segment $TS_FILE..."
              if ffmpeg -y -i "$TS_FILE" -c copy "$MP4_FILE"; then
                rm -f "$TS_FILE"
                echo "file '$MP4_FILE'" >> mylist.txt
              fi
            fi
          done

          if [ -s "mylist.txt" ]; then
            PART_COUNT=$(wc -l < mylist.txt)
            FINAL_FILE="${CHANNEL}_$(TZ='Asia/Kolkata' date +%Y-%m-%d_%H-%M-%S_IST).mp4"

            if [ "$PART_COUNT" -eq 1 ]; then
              FIRST_PART=$(awk -F"'" '{print $2}' mylist.txt)
              mv "$FIRST_PART" "$FINAL_FILE"
            else
              echo "Merging $PART_COUNT parts into a single continuous MP4..."
              ffmpeg -y -f concat -safe 0 -i mylist.txt -c copy "$FINAL_FILE"
              rm -f part_*.mp4
            fi

            GDRIVE_SUCCESS=false

            # 1st priority: Google Drive via RCLONE_CONFIG secret
            if [ -n "$RCLONE_CONFIG_DATA" ]; then
              mkdir -p ~/.config/rclone
              echo "$RCLONE_CONFIG_DATA" > ~/.config/rclone/rclone.conf
              RCLONE_REMOTE=$(rclone listremotes | head -n 1 | tr -d ':')

              if [ -n "$RCLONE_REMOTE" ]; then
                GDRIVE_FOLDER="Twitch_Recordings/${CHANNEL}"
                echo "Uploading to Google Drive: ${RCLONE_REMOTE}:${GDRIVE_FOLDER}..."
                if rclone copy "$FINAL_FILE" "${RCLONE_REMOTE}:${GDRIVE_FOLDER}" --drive-chunk-size 64M --stats=15s -v; then
                  GDRIVE_SUCCESS=true
                  GDRIVE_LINK=$(rclone link "${RCLONE_REMOTE}:${GDRIVE_FOLDER}/${FINAL_FILE}" 2>/dev/null || true)
                  echo "=========================================="
                  echo "UPLOAD SUCCESSFUL (GOOGLE DRIVE)"
                  [ -n "$GDRIVE_LINK" ] && echo "LINK: $GDRIVE_LINK"
                  echo "=========================================="
                  if [ -n "$GDRIVE_LINK" ]; then
                    echo "### ✅ [Uploaded to Google Drive ($PART_COUNT Part(s) Combined)]($GDRIVE_LINK)" >> "$GITHUB_STEP_SUMMARY"
                  else
                    echo "### ✅ Uploaded to Google Drive: \`${GDRIVE_FOLDER}/${FINAL_FILE}\` ($PART_COUNT Part(s) Combined)" >> "$GITHUB_STEP_SUMMARY"
                  fi
                else
                  echo "⚠️ Google Drive upload failed. Switching to Gofile failsafe..."
                fi
              else
                echo "⚠️ No remote found in RCLONE_CONFIG. Switching to Gofile failsafe..."
              fi
            else
              echo "⚠️ RCLONE_CONFIG secret is empty. Switching to Gofile failsafe..."
            fi

            # 2nd priority (failsafe): Gofile, then Litterbox
            if [ "$GDRIVE_SUCCESS" = "false" ]; then
              echo "Uploading to Gofile..."
              GOFILE_SERVER=$(curl -s https://api.gofile.io/servers | jq -r '.data.servers[0].name // "store1"')
              GOFILE_RESPONSE=$(curl -s -X POST "https://${GOFILE_SERVER}.gofile.io/contents/uploadfile" -F "file=@$FINAL_FILE")
              GOFILE_STATUS=$(echo "$GOFILE_RESPONSE" | jq -r '.status')

              if [ "$GOFILE_STATUS" != "ok" ]; then
                GOFILE_RESPONSE=$(curl -s -X POST "https://upload.gofile.io/uploadfile" -F "file=@$FINAL_FILE")
                GOFILE_STATUS=$(echo "$GOFILE_RESPONSE" | jq -r '.status')
              fi

              if [ "$GOFILE_STATUS" = "ok" ]; then
                LINK=$(echo "$GOFILE_RESPONSE" | jq -r '.data.downloadPage')
                echo "=========================================="
                echo "UPLOAD SUCCESSFUL (GOFILE): $LINK"
                echo "=========================================="
                echo "### 🎬 [Click Here to Download from Gofile ($PART_COUNT Part(s) Combined)]($LINK)" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "⚠️ Gofile failed. Uploading to Litterbox (72h temporary host)..."
                LITTER_LINK=$(curl -s -F "reqtype=fileupload" -F "time=72h" -F "fileToUpload=@$FINAL_FILE" https://litterbox.catbox.moe/resources/internals/api.php)

                if [[ "$LITTER_LINK" == https* ]]; then
                  echo "=========================================="
                  echo "UPLOAD SUCCESSFUL (LITTERBOX): $LITTER_LINK"
                  echo "=========================================="
                  echo "### 🎬 [Click Here to Download from Fallback Host ($PART_COUNT Part(s) Combined)]($LITTER_LINK)" >> "$GITHUB_STEP_SUMMARY"
                else
                  echo "❌ All cloud uploads failed."
                  echo "### ❌ Stream recorded ($FINAL_FILE), but all cloud uploads failed." >> "$GITHUB_STEP_SUMMARY"
                fi
              fi
            fi
          else
            echo "### ❌ Stream never went live during the monitoring window." >> "$GITHUB_STEP_SUMMARY"
          fi
